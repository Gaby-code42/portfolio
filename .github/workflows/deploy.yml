name: Déploiement

on:
  push:
    branches: [master]
  workflow_dispatch:

# Publication sur la branche gh-pages, que GitHub Pages sert déjà.
# C'est l'équivalent automatisé de `npm run deploy`.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    name: Publier sur GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npm test -- --watchAll=false

      - name: Construire le site
        run: npm run build

      - name: Générer le 404.html
        run: node scripts/copy-404.js

      - name: Publier sur la branche gh-pages
        run: |
          cd build
          git init -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Déploiement depuis ${GITHUB_SHA::7}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
